<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم نظام المراقبة</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a365d; color: #fff; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: #ffffff; color: #333; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .title { color: #1a365d; margin-bottom: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; color: #333; border-radius: 6px; overflow: hidden; }
        th { background: #2b6cb0; color: white; padding: 10px; font-size: 14px; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; text-align: center; }
        .badge { background: #e2e8f0; color: #2d3748; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .badge-success { background: #c6f6d5; color: #22543d; }
        .badge-warning { background: #feebc8; color: #744210; }
        .badge-danger { background: #fed7d7; color: #742a2a; }
        .loading { color: #cbd5e0; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 class="title">🔍 لوحة تحكم نظام المراقبة</h2>
        <p style="font-size: 12px; color: #666; margin: 0;">مراقبة التغييرات في مشاريع سكني | تنبيهات فورية</p>
    </div>

    <div class="card">
        <h3 style="margin-top: 0; color: #2b6cb0;">📋 قائمة المشاريع المراقبة</h3>
        <table>
            <thead>
                <tr>
                    <th>رقم المشروع</th>
                    <th>اسم المشروع</th>
                    <th>الوحدة المرجعية</th>
                    <th>متاحة</th>
                    <th>محجوزة</th>
                    <th>غير نشطة</th>
                </tr>
            </thead>
            <tbody id="projects-list">
                <tr><td colspan="6">جاري تحميل البيانات...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="loading" id="status-text">نظام المراقبة الذكي | جاري التحديث...</div>
</div>

<script>
    async function fetchDashboardData() {
        try {
            // طلب بيانات المشاريع من السيرفر
            const response = await fetch('/api/data');
            if (!response.ok) throw new Error('شبكة غير متوفرة');
            
            const data = await response.json();
            const tbody = document.getElementById('projects-list');
            tbody.innerHTML = '';

            if (!data.projects || data.projects.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">لا توجد مشاريع مراقبة حالياً</td></tr>';
                return;
            }

            data.projects.forEach(proj => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${proj.id || proj.project_id || '-'}</b></td>
                    <td>${proj.name || proj.project_name || 'مشروع'}</td>
                    <td><span class="badge">${proj.unit_id || proj.unit || '-'}</span></td>
                    <td><span class="badge badge-success">${proj.available ?? proj.available_units ?? 0}</span></td>
                    <td><span class="badge badge-warning">${proj.reserved ?? proj.reserved_units ?? 0}</span></td>
                    <td><span class="badge badge-danger">${proj.inactive ?? proj.inactive_units ?? 0}</span></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('status-text').innerText = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar-SA');
        } catch (error) {
            console.log('جاري جلب البيانات المرتبطة بالحالة الحالية...');
            // في حال عدم وجود مسار API معتمد في python يتم العرض التلقائي للبيانات
            fetchDataFallback();
        }
    }

    function fetchDataFallback() {
        // تحديث أوتوماتيكي للصفحة كل 30 ثانية لطلب البيانات من السيرفر مباشرة
        setTimeout(() => {
            location.reload();
        }, 30000);
    }

    // تشغيل عند فتح الصفحة وتكرار الطلب كل 15 ثانية
    fetchDashboardData();
    setInterval(fetchDashboardData, 15000);
</script>

</body>
</html>
